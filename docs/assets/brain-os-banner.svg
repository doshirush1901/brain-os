<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="Brain OS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1014"/>
      <stop offset="100%" stop-color="#1a2028"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8332a"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="280" rx="20" fill="url(#bg)"/>
  <rect width="920" height="6" rx="20" fill="#c8332a"/>
  <rect y="274" width="920" height="6" rx="20" fill="#264653" opacity="0.5"/>

  <g transform="translate(72 72)" filter="url(#soft)">
    <polygon points="70,20 118,100 22,100" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="70" cy="20" r="9" fill="#fafaf7"/>
    <circle cx="118" cy="100" r="9" fill="#e9c46a"/>
    <circle cx="22" cy="100" r="9" fill="#2a9d8f"/>
    <line x1="70" y1="20" x2="118" y2="100" stroke="#9ba3ad" stroke-width="2" opacity="0.5"/>
    <line x1="70" y1="20" x2="22" y2="100" stroke="#9ba3ad" stroke-width="2" opacity="0.5"/>
    <line x1="22" y1="100" x2="118" y2="100" stroke="#9ba3ad" stroke-width="2" opacity="0.5"/>
  </g>

  <text x="220" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#fafaf7" letter-spacing="0.06em">BRAIN OS</text>
  <text x="220" y="158" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9ba3ad">Forkable multi-agent operating system</text>
  <text x="220" y="192" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#5b6470">Mac · RAG · Graph · CRM · Cursor MCP · Local-first</text>

  <rect x="220" y="218" width="200" height="36" rx="8" fill="#c8332a" opacity="0.15"/>
  <text x="320" y="242" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e9c46a">Community + Pro · BSL 1.1</text>
</svg>
