[tool.poetry]
name = "brain-os"
version = "0.1.0"
description = "Forkable local-first multi-agent Brain OS"
authors = ["Brain OS Maintainers <maintainers@example.com>"]
license = "BSL-1.1"
readme = "README.md"
packages = [{ include = "brain_os", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pydantic = "^2.0"
pydantic-settings = "^2.0"
httpx = ">=0.27"
qdrant-client = "^1.9"
neo4j = "^5.0"
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
asyncpg = ">=0.29"
typer = ">=0.12"
rich = ">=13.0"
fastapi = ">=0.115"
uvicorn = {version = ">=0.30", extras = ["standard"]}
openai = ">=1.0"
anthropic = ">=0.30"
instructor = ">=1.14"
langfuse = ">=2.0,<3.0"
mcp = ">=1.0"
mem0ai = ">=0.1"
alembic = ">=1.13"
redis = {version = ">=5.0", extras = ["hiredis"]}
voyageai = "^0.3.0"
greenlet = "^3.3.2"

[tool.poetry.scripts]
brain = "brain_os.interfaces.cli:app"
brain-mcp = "brain_os.interfaces.mcp_server:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
